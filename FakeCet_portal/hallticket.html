<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Card</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}



    </style>
</head>
<body>
    <div class="rank-card">
        <h1>Rank Card</h1>
        <div class="student-info">
            <p><strong>Registrationnumber</strong> John Doe</p>
            <p><strong>HallticketNumber</strong> 12345</p>
        </div>
        <div class="marks">
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Maths</td>
                        <td>85</td>
                    </tr>
                    <tr>
                        <td>Physics</td>
                        <td>90</td>
                    </tr>
                    <tr>
                        <td>Chemistry</td>
                        <td>78</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="total">
            <p><strong>Total Marks:</strong> 253</p>
            <p><strong>Rank:</strong> 5</p>
        </div>
    </div>
</body>
</html>
