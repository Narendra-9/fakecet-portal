<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeCet</title>
    <link rel="icon" type="image/x-icon" href="./Css/Assets/fakecet_logog.png"> 
    <link rel="stylesheet" href="./Css/style1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./Css/collegelogin.css">
</head>
<body>
    <header class="headerr" style="backdrop-filter: blur(10px);  height: 115px;
    display: flex; background-color: rgba(0, 0, 0, 0.386); color: white; border-radius: 10px;">
        <div class="logo">
            <img src="./Css/Assets/fakecet_logog.png" alt="" height="80px" class="logoimg">
        </div>
        <div class="heading newheading">
            <div class="headingcontent">
                <p class="fakecet">FAKECET - 2024</p>
                <p class="para">Engineering College Common Entrance Portal</p>
                <p class="para">(Maintained by Fakify on behalf of FSCHE)</p>
            </div>
            <div class="logins">
                <p class="me-2"><a href="./login.html">Candidate Login</a></p>
                <p> | </p>
                <p class="ms-2"><a href=""> College Login</a></p>
            </div>
        </div>
    </header>

    <section class="login-container container " >
        <form action="" class="login-container-form">
        <div class="row mb-2">
            <div class="col">
                <h3 class="text-center" style="color: white;">College Login</h3>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Enter registration No." required>
                    <label for="floatingInput">College Code</label>
                  </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Enter password" required>
                    <label for="floatingPassword">Password</label>
                  </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col text-center">
                <p class="register">Don't have an account? Register</p>
            </div>
        </div>
        <div class="row mt-4 justify-content-center">
            <div class="col-3">
                <button type="submit" class="btn btn-primary login-btn">Login</button>
            </div>
        </form>
        </div>

        
    </section>

    <section class="login-container container register-container" style="display: none;" >
        <form action="" class="register-container-form">
        <div class="row mb-2">
            <div class="col">
                <h3 class="text-center" style="color: white;">College Register</h3>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Enter registration No." required>
                    <label for="floatingInput">College Code</label>
                  </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Enter registration No." required>
                    <label for="floatingInput">College Name</label>
                  </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Enter registration No." required>
                    <label for="floatingInput">Password</label>
                  </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Enter registration No." required>
                    <label for="floatingInput">Confirm Password </label>
                  </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col text-center">
                <p class="loginnavigate">Already have an account? Login</p>
            </div>
        </div>
        <div class="row mt-4 justify-content-center">
            <div class="col-3">
                <button type="submit" class="btn btn-primary login-btn">Register</button>
            </div>
        </form>
        </div>

        
    </section>
    
        
    
    <script src="./JavaScript/collegelogin.js"></script>
    <!-- <script src="./JavaScript/script1.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
