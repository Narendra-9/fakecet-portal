    <section class="main-content container mt-3">
       <div class="row">

            <div class="row gy-3">

                        <select class="form-select clg-option" id="floatingSelect" aria-label="Floating label select example">

                          <!-- <option value="1">One</option>

                    <div class="form-floating">
                        <select class="form-select branch-option" id="floatingSelect" aria-label="Floating label select example">
                       
                            <!-- <option value="1">One</option>

            <div class="row gy-3 justify-content-center mt-2">

                    </thead>
                    <tbody>
                      <!-- <tr class="text-wrap text-center">
                        <th scope="row">1</th>
                        <td>Mark</td>

                      </tr> -->
                    </tbody>
                  </table>
            </div>
            <div class="row justify-content-end">
                <div class="col-2">
                    <button class="btn btn-success submitpreferences">Submit</button>
                </div>
            </div>
        </div>
       </div>

    <script>

        let colleges={
            "JNTU kakinada" : ["ECE","CSE","MECH","CHEM","CIVIL"],
            "JNTU Narasaraopeta" : ["ECE","CSE","MECH","CHEM","CIVIL"],
            "BV Raju" : ["ECE","CSE","MECH","CHEM","CIVIL","IT","CSM","AIML"],
            "SRKR":["ECE","AIDS","MECH","CHEM","CIVIL","IT","CSM","AIML","CSE"]
        }

        // for(let x of Object.keys(colleges)){
        //     document.querySelector(".clg-option").innerHTML+=`<option value="${x}" class="${x}">${x}</option>`; 
        // }

        // function getbranches(){
        //     console.log(this.value)
        // }

        for (let college of Object.keys(colleges)) {
        document.querySelector(".clg-option").innerHTML += `<option value="${college}">${college}</option>`;
        }
        document.querySelector(".clg-option").addEventListener("change", function() {
            const selectedCollege = this.value;
            const branchSelect = document.querySelector(".branch-option");
            branchSelect.innerHTML = `<option selected disabled>--</option>`;
            if (selectedCollege) {
                colleges[selectedCollege].forEach(branch => {
                branchSelect.innerHTML += `<option value="${branch}">${branch}</option>`;
            });
            }
        });
        
        let cnt = 1;

        document.querySelector(".addpreference").addEventListener("click", () => {
        let college = document.querySelector(".clg-option").value;
        let branch = document.querySelector(".branch-option").value;

        if (college!=="--" && branch!=="--" && branch) {
            const existingRows = document.querySelectorAll(".preference-option");
            let isDuplicate = false;

            existingRows.forEach(row => {
                if (row.children[1].textContent === college && row.children[2].textContent === branch) {
                    isDuplicate = true;
                }
            });

            if (!isDuplicate) {
                document.querySelector("tbody").innerHTML += `
                    <tr class="text-wrap text-center preference-option">
                        <th scope="row">${cnt++}</th>
                        <td>${college}</td>
                        <td>${branch}</td>
                        <td><button class="btn btn-danger deletebtn" >Delete</button></td>
                    </tr>`;
                document.querySelectorAll(".deletebtn").forEach(i=>i.addEventListener('click',deleterow))
                document.querySelector(".clg-option").value ="--";
                document.querySelector(".branch-option").value="--";
            }
            else{
                alert("Duplicates not allowed");
            }
        } else {
            alert("Please select both college and branch.");
        }
        });
        function deleterow(e){
            e.target.parentElement.parentElement.remove();
            let newcnt=1
            document.querySelectorAll(".preference-option").forEach(i=>i.children[0].innerText=(newcnt++))
        }

        document.querySelector(".resettable").addEventListener('click',()=>{
          document.querySelector("tbody").innerHTML="";
        })

        document.querySelector(".submitpreferences").addEventListener('click',()=>{
            if(confirm("Do you want to submit?")){  
                document.querySelector(".addpreference").classList.add("disabled");
                document.querySelector(".submitpreferences").classList.add("disabled");
                document.querySelectorAll(".deletebtn").forEach((button)=>button.classList.add("disabled"));
                document.querySelector(".resettable").classList.add("disabled");
            }
        })
    </script>
