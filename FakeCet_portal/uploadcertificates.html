    <section class="getresultform container mt-4">
      <div class="row formheading">
          <p style="font-size: 20px;">Upload Certificates</p>
      </div>
      <form class=" mt-2 uploadcertificates">
          <div class="row">
              <div class="col-lg-3">
                  <div class="label1 mb-1">
                      <label for="rnumber">AadharCard<span>*</span></label>
                  </div>
                  <input class="field" type="file" name="Registrationnumber" id="rnumber" placeholder="Enter Candidate Name" required>
              </div>
              <div class="col-lg-3">
                  <div class="label2 mb-1">
                      <label for="fatherName">SSC Certificate<span>*</span></label>
                  </div>
                  <input class="field" type="file" name="fatherName" id="fatherName" placeholder="Enter Father's Name" eequired>
              </div>
              <div class="col-lg-3">
                  <div class="label2 mb-1">
                      <label for="fatherOccupation">Intermediate Certificate<span>*</span></label>
                  </div>
                  <input class="field" type="file" name="fatherOccupation" id="fatherOccupation" placeholder="Enter Father's Occupation" required>
              </div>
              <div class="col-lg-3">
                  <div class="label2 mb-1">
                      <label for="motherOccupation">FakeCet RankCard<span>*</span></label>
                  </div>
                  <input class="field mb-1" type="file" name="motherOccupation" id="motherOccupation" placeholder="Enter Mother's Occupation" required>
              </div>
              <div class="col-lg-3">
                <div class="label2 mb-1">
                    <label for="motherOccupation">Caste Certificate</label>
                </div>
                <input class="field mb-3" type="file" name="motherOccupation" id="motherOccupation" placeholder="Enter Mother's Occupation" required>
            </div>
          </div>
          <div class="row justify-content-end">
            <div class="col-lg-1 me-3 ms-3">
                <button class="btn btn-success mb-3">Upload</button>
            </div>
          </div>
      </form>
  </section>

  </script>
